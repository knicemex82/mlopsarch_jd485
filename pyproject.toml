[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knicemex82-mlopsarch_jd485"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出MLOps 平台架构师·流水线的数据倾斜上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "knicemex82" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://knicemex82.github.io"
Repository = "https://github.com/knicemex82/mlopsarch_jd485"
Issues = "https://github.com/knicemex82/mlopsarch_jd485/issues"

[project.scripts]
mlopsarch_jd485 = "mlopsarch_jd485:main"

[tool.setuptools]
py-modules = ["mlopsarch_jd485"]
